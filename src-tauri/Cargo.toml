[package]
name = "betteraimaira"
version = "0.1.1-beta.15"
description = "Alternative Tauri client for Aimaira student intranets."
authors = ["Timothe Montfrond"]
license = "GPL-3.0-only"
repository = "https://github.com/fr-timothe/BetterAimaira"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "betteraimaira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Local automation bridge for development only. `tauri dev` enables it through
# `.cargo/config.toml`; release bundles must never opt in.
dev-automation = ["tauri-plugin-mcp-bridge"]

[dependencies]
futures-util = "0.3"
keyring-core = "1"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.24"
semver = "1"
tauri = { version = "2", features = [] }
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

# The signed in-place updater exists on desktop only; Android and iOS install
# through the system package installer and AltStore respectively.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"
jni = "0.21"
ndk-context = "0.1"

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "openbsd"))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
