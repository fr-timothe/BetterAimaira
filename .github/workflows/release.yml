name: release

# Publishes the artifacts the in-app updater reads. Pushing a `v*` tag builds
# the Windows installer, the Android APK and an unsigned iOS IPA, writes
# `latest.json` and `altstore.json`, attaches everything to the GitHub release,
# and commits the two manifests to the `gh-pages` branch the app polls.
#
# The app reads the feed from GitHub Pages, not from `releases/latest/download`:
# that path only ever resolves to the newest release *not* flagged as a
# prerelease, so a project shipping betas serves a 404 to every client.
#
# Pages is configured once, in Settings > Pages: Source = "Deploy from a branch",
# branch `gh-pages`, folder `/ (root)`, custom domain
# `betteraimaira.montfrond.work`. The domain is carried by the `CNAME` file at
# the root of that branch, which this workflow preserves.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY           minisign key from `bun run updater:keygen`
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password (empty string if none)
#   ANDROID_KEYSTORE_BASE64             base64 of the release keystore
#   ANDROID_KEYSTORE_PASSWORD           keystore password
#   ANDROID_KEY_ALIAS                   key alias inside the keystore
#   ANDROID_KEY_PASSWORD                key password
#
# The Rust and Gradle caches are read-only here: they are published by the
# `warm-cache` workflow on the default branch, because a cache written by a tag
# run cannot be restored by the next tag.
#
# The IPA is built without code signing: AltStore and SideStore re-sign with the
# installing user's own Apple ID, so no Apple Developer material is needed here.
# That job is best-effort — `publish` does not wait on it, and a release without
# an IPA simply carries an empty AltStore version list.

# The tag is the only trigger: bumping the version and pushing the commit
# publishes nothing. `bun run release:tag` is the other half of a bump.
on:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: windows
          save-if: false

      - run: bun install --frozen-lockfile

      # The signed `.sig` next to the installer is what the desktop updater
      # verifies; without the signing key the bundle is useless as an update.
      - name: Build installer
        run: bun tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # No emulator: the default `packages` value pulls it in through the
      # obsolete `tools` meta-package, and it is roughly 500 MB this job never
      # opens. Dropping it is what `warm-cache` runs on, which is how we know
      # the runner's own platforms and build-tools are enough for Gradle.
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      # arm64-v8a and armeabi-v7a cover every real device; x86_64 is added so
      # the update flow can be tested on an Android Studio emulator, which
      # refuses an APK with no matching ABI. i686 is left out: no device and no
      # current emulator image needs it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: android
          save-if: false

      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle.kts', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # The keystore never lives in the repository: the release build reads it
      # from `keystore.properties`, which is git-ignored and written here.
      - name: Write signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          keystore_path="$GITHUB_WORKSPACE/src-tauri/gen/android/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          cat > src-tauri/gen/android/keystore.properties <<PROPERTIES
          storeFile=$keystore_path
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES

      # Android reads the version code, not the version name: an APK whose code
      # is not higher than the installed one is not an update, whatever the tag
      # says. The code is derived from the package version here rather than
      # trusted from the checkout, so a version bump that forgot it still ships
      # a real update.
      - name: Derive the Android version code
        run: bun run android:version-code

      - name: Build APK
        run: |
          bun run android:sync
          bun tauri android build --apk --target aarch64 --target armv7 --target x86_64
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    # An IPA is a bonus, not a release blocker: a failure here must not stop the
    # Windows and Android assets from shipping.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          shared-key: ios
          save-if: false

      - run: bun install --frozen-lockfile

      # `gen/apple` is not committed, so the Xcode project is generated on every
      # run. `--ci` keeps `init` from asking for a development team.
      - name: Generate the Xcode project
        run: bun tauri ios init --ci

      # The Tauri CLI keeps its mobile build options alive for the Xcode script,
      # builds the frontend and creates an unsigned IPA suitable for AltStore.
      - name: Build the unsigned IPA
        run: |
          bun tauri ios build --ci --no-sign
          ipa=$(find src-tauri -type f -name '*.ipa' | head -n 1)
          test -n "$ipa" || { echo "No IPA produced"; exit 1; }
          cp "$ipa" BetterAimaira.ipa

      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: BetterAimaira.ipa
          if-no-files-found: error

  publish:
    # `ios` is deliberately absent: the release ships with whatever built.
    needs: [windows, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release notes are built from the commits between the previous tag and
      # this one, so the shallow default checkout is not enough: it carries no
      # tags and no history to walk.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      # Each bundler names its output its own way: `BetterAimaira_0.1.1_x64-setup.exe`
      # from the NSIS bundler, `app-universal-release.apk` from Gradle, a bare
      # `BetterAimaira.ipa`. One scheme replaces all three,
      # `BetterAimaira-v<version>-<arch>.<extension>`, so the platform is carried
      # by the extension alone and the arch is readable at a glance.
      #
      # Renaming is safe for the desktop updater: it identifies the installer by
      # the downloaded bytes, never by the file name.
      - name: Stage the release assets under one naming scheme
        run: |
          base="BetterAimaira-${GITHUB_REF_NAME}"
          installer=$(find artifacts/windows -name '*-setup.exe' | head -n 1)
          apk=$(find artifacts/android -name '*.apk' | head -n 1)
          ipa=$(find artifacts -name '*.ipa' | head -n 1)

          mkdir -p release-assets
          cp "$installer" "release-assets/$base-x86_64.exe"
          # The updater reads the signature out of the manifest, so this asset is
          # for humans verifying a download by hand. It tracks the installer name.
          cp "$installer.sig" "release-assets/$base-x86_64.exe.sig"
          cp "$apk" "release-assets/$base-universal.apk"
          if [ -n "$ipa" ]; then cp "$ipa" "release-assets/$base-arm64.ipa"; fi
          ls -l release-assets

      # Written from the staged names, so every URL in the manifests matches an
      # asset that is actually attached to the release.
      - name: Write update manifests
        run: |
          base="BetterAimaira-${GITHUB_REF_NAME}"
          arguments=(
            --version "${GITHUB_REF_NAME#v}"
            --windows-installer "release-assets/$base-x86_64.exe"
            --windows-signature "release-assets/$base-x86_64.exe.sig"
            --apk "release-assets/$base-universal.apk"
          )
          # Without an IPA the AltStore source lists no version and the iOS
          # check reports "up to date" instead of failing.
          if [ -f "release-assets/$base-arm64.ipa" ]; then
            arguments+=(--ipa "release-assets/$base-arm64.ipa")
          fi
          bun run release:manifest -- "${arguments[@]}"

      # `--generate-notes` lists pull requests, and this project ships straight
      # from `master`: it produced a release page holding nothing but a compare
      # link. The notes are written from the commit range instead.
      - name: Write the release notes
        run: bun run release:notes -- --tag "${GITHUB_REF_NAME}" --output dist-release/NOTES.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(dist-release/latest.json dist-release/altstore.json release-assets/*)
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "BetterAimaira ${GITHUB_REF_NAME#v}" \
            --notes-file dist-release/NOTES.md \
            "${flags[@]}" \
            "${assets[@]}"

      # The feed the app actually reads. `gh-pages` is an orphan branch holding
      # nothing but these manifests, so `master` is never touched and the channel
      # this tag does not belong to keeps the manifest it already had.
      - name: Publish the update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A prerelease only ever reaches beta. A finished stable release
          # supersedes the betas that led to it, so it lands on both channels.
          channels=(beta)
          if [[ "$GITHUB_REF_NAME" != *-* ]]; then channels+=(stable); fi

          site=$(mktemp -d)
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A clone that misses means the branch does not exist yet, so the first
          # release creates it.
          if ! git clone --depth 1 --branch gh-pages "$remote" "$site" 2>/dev/null; then
            git init -q -b gh-pages "$site"
            git -C "$site" remote add origin "$remote"
          fi

          for channel in "${channels[@]}"; do
            mkdir -p "$site/updates/$channel"
            cp dist-release/latest.json "$site/updates/$channel/latest.json"
            cp dist-release/altstore.json "$site/updates/$channel/altstore.json"
          done
          # Pages runs Jekyll by default. It has nothing to build here and would
          # hide any path starting with an underscore.
          touch "$site/.nojekyll"
          # GitHub serves the custom domain only while this file sits at the site
          # root, and the clone above already carries whatever it holds. It is
          # written only when absent, so a domain changed in Settings survives
          # the next tag, and a branch recreated from scratch keeps its domain.
          if [ ! -f "$site/CNAME" ]; then
            echo -n "betteraimaira.montfrond.work" > "$site/CNAME"
          fi

          git -C "$site" config user.name "github-actions[bot]"
          git -C "$site" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$site" add -A
          # Re-running a tag with identical manifests must not fail the job.
          if git -C "$site" diff --cached --quiet; then
            echo "Feed already up to date for ${GITHUB_REF_NAME}"
            exit 0
          fi
          git -C "$site" commit -q -m "chore(feed): publish ${GITHUB_REF_NAME} on ${channels[*]}"
          git -C "$site" push -q origin gh-pages
